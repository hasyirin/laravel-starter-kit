; deploy/supervisor/install.sh fills in the ${...} values and writes the result to /etc/supervisor/conf.d/<app>-horizon.conf.
[program:${APP_NAME}-horizon]
process_name=%(program_name)s
command=php ${APP_PATH}/artisan horizon
user=${APP_USER}
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=${APP_PATH}/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
